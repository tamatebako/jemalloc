name: Release

permissions:
  contents: write
  pull-requests: write
  issues: write

on:
  workflow_dispatch:
    inputs:
      next_version:
        description: |
          Next release version. Possible values: x.y.z, major, minor, patch, or skip.
          - major: Bump major version (5.5.0 → 6.0.0)
          - minor: Bump minor version (5.5.0 → 5.6.0)
          - patch: Bump patch version (5.5.0 → 5.5.1)
          - x.y.z: Specific version (e.g., 6.2.1)
          - skip: Skip version bump, create release from current version
        required: true
        default: 'minor'
      create_github_release:
        description: 'Create GitHub release after tagging?'
        required: true
        type: boolean
        default: true
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  validate-and-bump:
    name: Validate and bump version
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      release_branch: ${{ steps.create_branch.outputs.branch }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version input
        id: validate
        run: |
          VERSION_INPUT="${{ github.event.inputs.next_version }}"

          if [[ "$VERSION_INPUT" == "skip" ]]; then
            echo "Skipping version bump, using current version"
            echo "skip_bump=true" >> $GITHUB_OUTPUT
          elif [[ "$VERSION_INPUT" =~ ^(major|minor|patch)$ ]]; then
            echo "Valid bump type: $VERSION_INPUT"
            echo "skip_bump=false" >> $GITHUB_OUTPUT
          elif [[ "$VERSION_INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Valid specific version: $VERSION_INPUT"
            echo "skip_bump=false" >> $GITHUB_OUTPUT
          else
            echo "::error::Invalid version input: $VERSION_INPUT"
            exit 1
          fi

      - name: Bump version
        if: steps.validate.outputs.skip_bump == 'false'
        run: |
          echo "Running version bump script..."
          echo "y" | ./.github/scripts/bump-version.sh "${{ github.event.inputs.next_version }}"

      - name: Get new version
        id: get_version
        run: |
          # Get version from vcpkg.json (after bump) or git tag (if skip)
          if [ "${{ steps.validate.outputs.skip_bump }}" = "true" ]; then
            VERSION=$(git describe --tags --abbrev=0 | sed 's/^v//')
          else
            VERSION=$(grep '"version-string"' ports/jemalloc/vcpkg.json | cut -d'"' -f4)
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Determined version: $VERSION"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create release branch
        id: create_branch
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          BRANCH="release/v${VERSION}"

          git checkout -b "$BRANCH"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "Created branch: $BRANCH"

      - name: Commit version bump
        if: steps.validate.outputs.skip_bump == 'false'
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"

          git add ports/jemalloc/vcpkg.json ChangeLog
          git commit -m "chore: bump version to ${VERSION}" \
            -m "This commit updates vcpkg.json and ChangeLog for the ${VERSION} release." \
            -m "The ChangeLog entry contains a template that should be filled in during the PR review process before merging."

      - name: Push release branch
        run: |
          BRANCH="${{ steps.create_branch.outputs.branch }}"
          git push origin "$BRANCH"

  create-pr:
    name: Create release PR
    if: github.event_name == 'workflow_dispatch'
    needs: validate-and-bump
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # validate-and-bump already pushed the bump commit to
      # release/v${VERSION}, so we just open a PR for that existing branch.
      # Previously this step used peter-evans/create-pull-request, which
      # silently reset the branch to match base when it saw no uncommitted
      # changes locally (the bump had already been committed by the prior
      # job) — discarding the bump commit and skipping the tag/release job.
      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: ${{ needs.validate-and-bump.outputs.release_branch }}
          VERSION: ${{ needs.validate-and-bump.outputs.version }}
          CREATE_GH_RELEASE: ${{ github.event.inputs.create_github_release }}
          NEXT_VERSION: ${{ github.event.inputs.next_version }}
        run: |
          PR_BODY_FILE="$(mktemp)"
          {
            echo "## Release v${VERSION}"
            echo ""
            echo "This PR prepares the release for version ${VERSION}."
            echo ""
            echo "### Changes"
            echo "- Updated vcpkg.json to ${VERSION}"
            echo "- Added ChangeLog entry template"
            echo ""
            echo "### Before Merging"
            echo "- [ ] Review and complete the ChangeLog entry"
            echo "- [ ] Verify all CI tests passed (will run automatically on this PR)"
            echo "- [ ] Ensure version number is correct"
            echo "- [ ] Update release notes if needed"
            echo ""
            echo "### After Merging"
            echo "The following will happen automatically:"
            echo "- Git tag \`v${VERSION}\` will be created"
            if [ "${CREATE_GH_RELEASE}" = "true" ]; then
              echo "- GitHub release will be published"
            else
              echo "- No GitHub release will be created (manual step required)"
            fi
            echo ""
            echo "---"
            echo ""
            echo "**Version bump type**: \`${NEXT_VERSION}\`"
            echo "**GitHub release**: \`${CREATE_GH_RELEASE}\`"
            echo "**Version source**: Git tags + vcpkg.json (VERSION file is generated by CMake)"
          } > "$PR_BODY_FILE"

          gh pr create \
            --base main \
            --head "$RELEASE_BRANCH" \
            --title "Release v${VERSION}" \
            --body-file "$PR_BODY_FILE" \
            --label release \
            --label automated

  tag-and-release:
    name: Tag and create GitHub release
    runs-on: ubuntu-24.04
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'release')
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      tag: ${{ steps.get_version.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from vcpkg.json
        id: get_version
        run: |
          VERSION=$(grep '"version-string"' ports/jemalloc/vcpkg.json | cut -d'"' -f4)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Extract release notes from ChangeLog
        id: extract_notes
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          NOTES_FILE=$(mktemp)

          awk -v ver="$VERSION" '
            /^\* [0-9]+\.[0-9]+\.[0-9]+/ {
              if (in_section) exit;
              if ($0 ~ ver) {
                in_section=1;
                next;
              }
            }
            in_section { print }
          ' ChangeLog > "$NOTES_FILE"

          echo "notes_file=$NOTES_FILE" >> $GITHUB_OUTPUT

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create Git tag
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"
          echo "Created and pushed tag: v${VERSION}"

      - name: Create GitHub Release
        if: github.event.inputs.create_github_release == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: jemalloc v${{ steps.get_version.outputs.version }}
          body_path: ${{ steps.extract_notes.outputs.notes_file }}
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          echo "::notice::Successfully created release v${VERSION}"
          echo "::notice::Git tag: v${VERSION}"
          if [[ "${{ github.event.inputs.create_github_release }}" == "true" ]]; then
            echo "::notice::GitHub release: https://github.com/${{ github.repository }}/releases/tag/v${VERSION}"
          fi

  build-ohos-artifacts:
    # Cross-compiles jemalloc for aarch64-linux-ohos and uploads signed
    # artifacts to the release. Reuses the same setup-ohos-ndk.sh +
    # binary-sign-tool flow as the ohos.yml CI workflow.
    name: Cross-compile OHOS artifacts + upload to release
    needs: tag-and-release
    runs-on: ubuntu-latest
    if: needs.tag-and-release.result == 'success' && github.event.inputs.create_github_release == 'true'
    timeout-minutes: 60

    steps:
      - name: Checkout at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag-and-release.outputs.tag }}
          fetch-depth: 0

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              build-essential cmake ninja-build curl jq unzip file ca-certificates

      - name: Cache OHOS NDK (~4 GB)
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: /opt/ohos
          key: ohos-ndk-${{ hashFiles('.github/scripts/setup-ohos-ndk.sh') }}

      - name: Setup OHOS NDK (if cache miss)
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: ./.github/scripts/setup-ohos-ndk.sh --prefix /opt/ohos

      - name: Cross-compile jemalloc
        run: |
          cmake -S . -B build-ohos \
            -DCMAKE_TOOLCHAIN_FILE=/opt/ohos/ohos-sdk/linux/native/build/cmake/ohos.toolchain.cmake \
            -DOHOS_ARCH=arm64-v8a \
            -DOHOS_PLATFORM=OHOS \
            -DCMAKE_BUILD_TYPE=Release \
            -DJEMALLOC_BUILD_SHARED=ON \
            -DJEMALLOC_BUILD_STATIC=ON \
            -DJEMALLOC_ENABLE_STATS=ON \
            -DJEMALLOC_ENABLE_PROF=OFF \
            -DJEMALLOC_ENABLE_DOC=OFF \
            -DBUILD_TESTING=OFF \
            -G Ninja
          cmake --build build-ohos -j"$(nproc)"

      - name: Verify .so is ARM aarch64 ELF
        run: |
          # Follow symlinks: libjemalloc.so is the dev symlink.
          file -L build-ohos/libjemalloc.so
          file -L build-ohos/libjemalloc.so | grep -q 'ELF 64-bit LSB .* ARM aarch64'

      - name: Code-sign libjemalloc.so
        run: |
          /opt/ohos/ohos-sdk/linux/toolchains/lib/binary-sign-tool sign \
            -selfSign 1 \
            -inFile build-ohos/libjemalloc.so \
            -outFile build-ohos/libjemalloc.so

      - name: Stage artifacts for upload
        run: |
          mkdir -p ohos-artifacts
          cp -a build-ohos/libjemalloc.so      ohos-artifacts/
          cp -a build-ohos/libjemalloc.so.*    ohos-artifacts/ 2>/dev/null || true
          cp -a build-ohos/libjemalloc.a       ohos-artifacts/
          tar -czf ohos-artifacts/jemalloc-ohos-include.tar.gz \
              -C build-ohos include
          # Generate a brief SHA256 manifest.
          ( cd ohos-artifacts && sha256sum * | tee SHA256SUMS )

      - name: Run smoke-test in dockerharmony
        run: |
          # Build smoke-test binary, run it via qemu+dockerharmony, ensure
          # the uploaded artifacts actually work end-to-end on OHOS.
          /opt/ohos/llvm-19/llvm/bin/clang \
            --target=aarch64-linux-ohos \
            --sysroot=/opt/ohos/ohos-sdk/linux/native/sysroot \
            -O2 -I build-ohos/include -L build-ohos -Wl,-rpath='$ORIGIN' \
            -o build-ohos/smoke-test .github/scripts/ohos-smoke-test.c \
            -ljemalloc -lpthread -ldl
          mkdir -p ohos-verify
          cp -a build-ohos/libjemalloc.so* ohos-verify/ 2>/dev/null || true
          cp -a build-ohos/libjemalloc.so  ohos-verify/
          cp -a build-ohos/smoke-test      ohos-verify/
          docker run --privileged --rm tonistiigi/binfmt --install arm64
          docker run --rm --platform linux/arm64 \
            -v "$PWD/ohos-verify:/work" -w /work \
            ghcr.io/hqzing/dockerharmony:latest \
            sh -c 'LD_LIBRARY_PATH=. ./smoke-test'

      - name: Upload signed .so + .a + headers to release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.tag-and-release.outputs.tag }}
          files: |
            ohos-artifacts/libjemalloc.so
            ohos-artifacts/libjemalloc.so.*
            ohos-artifacts/libjemalloc.a
            ohos-artifacts/jemalloc-ohos-include.tar.gz
            ohos-artifacts/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
